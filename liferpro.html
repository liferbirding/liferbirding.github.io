<!DOCTYPE html>
<!--
  /liferpro — PERMANENT REDIRECT STUB. DO NOT DELETE OR RENAME THIS FILE.

  This URL is hardcoded in the "View perks" button on the Lifer app's
  paywall and is baked into binaries already shipped on both stores.
  Removing or renaming it breaks that button for every installed copy
  of the app, and cannot be fixed without a new app release.

  The redirect TARGET is safe to change at any time — a one-line edit
  here, no app release and no store review. It currently points at the
  venue directory, where Lifer Pro venue perks live.
-->
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  // Primary redirect. location.replace() writes no history entry, so the
  // in-app browser's back button returns the user to the paywall instead
  // of landing back here and bouncing forward again.
  location.replace('where-to-go.html');
</script>
<meta http-equiv="refresh" content="0; url=where-to-go.html">
<title>Lifer Pro perks — Lifer</title>
<meta name="description" content="Lifer Pro venue perks — see the Lifer birding directory for venues offering perks to Lifer Pro members.">
<link rel="canonical" href="https://liferbirding.com/where-to-go.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=Inter:ital,wght@0,400;0,500;0,600;1,400;1,500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="lifer-site.css">
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon.png">
<link rel="icon" type="image/png" sizes="512x512" href="img/icon.png">
<link rel="apple-touch-icon" sizes="180x180" href="img/apple-touch-icon.png">
<style>
.lp-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:64px 24px;background:var(--ink);}
.lp-inner{display:flex;flex-direction:column;align-items:center;gap:26px;}
.lp-lockup{width:min(300px,66vw);height:auto;display:block;}
.lp-line{color:var(--night-text-2);font-size:15px;line-height:1.6;}
.lp-line a{color:var(--wattle);font-weight:600;text-decoration:underline;text-underline-offset:3px;}
</style>
</head>
<body>
<div class="lp-wrap">
  <div class="lp-inner">
    <img class="lp-lockup" src="img/wordmark-stacked-dark.svg" alt="Lifer — Capture · Collect · Compete">
    <p class="lp-line">Taking you to the Lifer birding directory. <a href="where-to-go.html">Continue</a>.</p>
  </div>
</div>
</body>
</html>
